name: XAU Weekly Phase 4 brief (parallel-run with GAS)
# Replaces goldbot-line GAS Phase 4 brief Sat 06/07/08/09 ICT.
# PARALLEL-RUN with GAS for 2 Saturdays before GAS disabled.
# See MIGRATION.md Phase B.

on:
  schedule:
    # Sat 06/07/08/09 ICT (UTC+7)
    - cron: "0 23 * * 5"    # ICT Sat 06:00
    - cron: "0 0,1,2 * * 6" # ICT Sat 07:00 / 08:00 / 09:00
  workflow_dispatch:
    inputs:
      slot:
        description: "Force slot (opening|preview|deep|close)"
        required: false
        default: "preview"

permissions:
  contents: read

jobs:
  weekly-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compose + push weekly Phase 4
        env:
          LINE_CHANNEL_TOKEN:  ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_BRIEF_TARGET:   ${{ secrets.LINE_NEWS_TARGET }}
          GSHEET_ID:           ${{ secrets.GSHEET_ID }}
          GSHEET_CREDS:        ${{ secrets.GSHEET_CREDS }}
          LOG_LEVEL:           INFO
          PHASE_B_PARALLEL_RUN: "1"
        run: |
          python -m src.xau_brief.weekly
