name: calendar-check
on:
  schedule:
    # Weekdays only — economic releases concentrate Mon–Fri.
    # Pre-release window is [15, 25) minutes; running every 10 min catches every event.
    - cron: "*/10 * * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_NEWS_TARGET:   ${{ secrets.LINE_NEWS_TARGET }}
      LINE_HEALTH_TARGET: ${{ secrets.LINE_HEALTH_TARGET }}
      GSHEET_ID:          ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:       ${{ secrets.GSHEET_CREDS }}
      FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
      # Thai "what this print means for gold" explainer on Released-News cards
      # (Claude Haiku → Gemini). Without these the card silently degrades to
      # directional-only. Env-gated no-op when unset.
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      # CHUM News Bot (Telegram) — pre T-15 + post Released-News cards.
      NEWS_BOT_WEBHOOK_URL: ${{ secrets.NEWS_BOT_WEBHOOK_URL }}
      NEWS_BOT_SECRET:      ${{ secrets.NEWS_BOT_SECRET }}
      # Alert-bot next-event window gate (push_next_event_window). Env-gated.
      MACRO_WEBHOOK_URL:    ${{ secrets.MACRO_WEBHOOK_URL }}
      MACRO_WEBHOOK_SECRET: ${{ secrets.MACRO_WEBHOOK_SECRET }}
      PYTHONUNBUFFERED:   "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode calendar_check
