name: calendar-check
on:
  schedule:
    # Weekdays only — economic releases concentrate Mon–Fri.
    # Pre-release window is [15, 25) minutes; running every 10 min catches every event.
    - cron: "*/10 * * * 1-5"
  workflow_dispatch:
    inputs:
      # Set by release_pinger.yml: XAU spot ~25 s before the print, recorded on
      # the spot tape as the Released card's $-move base. Empty from cron-job.org.
      spot_base:
        description: "XAU spot just before the release (optional)"
        required: false
        default: ""
      spot_base_ts:
        description: "UTC ISO time of spot_base (optional)"
        required: false
        default: ""

concurrency:
  group: gold-news
  cancel-in-progress: false

permissions:
  actions: write            # dispatch release_pinger.yml ahead of a release
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # was 3: Sheets retries (5x, 2-30s) + FF retries could be killed after the LINE push but before sent_log flushed → duplicate card next run
    env:
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_NEWS_TARGET:   ${{ secrets.LINE_NEWS_TARGET }}
      LINE_HEALTH_TARGET: ${{ secrets.LINE_HEALTH_TARGET }}
      GSHEET_ID:          ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:       ${{ secrets.GSHEET_CREDS }}
      FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
      # Thai "what this print means for gold" explainer on Released-News cards
      # (Claude Haiku → Gemini). Without these the card silently degrades to
      # directional-only. Env-gated no-op when unset.
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
      # CHUM News Bot (Telegram) — pre T-15 + post Released-News cards.
      NEWS_BOT_WEBHOOK_URL: ${{ secrets.NEWS_BOT_WEBHOOK_URL }}
      NEWS_BOT_SECRET:      ${{ secrets.NEWS_BOT_SECRET }}
      # Alert-bot next-event window gate (push_next_event_window). Env-gated.
      MACRO_WEBHOOK_URL:    ${{ secrets.MACRO_WEBHOOK_URL }}
      MACRO_WEBHOOK_SECRET: ${{ secrets.MACRO_WEBHOOK_SECRET }}
      PYTHONUNBUFFERED:   "1"
      GH_TOKEN:           ${{ github.token }}
      GITHUB_REPOSITORY:  ${{ github.repository }}
      SPOT_BASE:          ${{ inputs.spot_base }}
      SPOT_BASE_TS:       ${{ inputs.spot_base_ts }}
    steps:
      - uses: actions/checkout@v4
      # Last-good ForexFactory feed (src/calendar.py FF_CACHE_PATH): used only
      # when the live fetch fails after retries (FF 429s near release slots).
      # Unique key per run + prefix restore = always restore the newest copy.
      - uses: actions/cache@v4
        with:
          path: .ff_cache
          key: ff-cache-${{ github.run_id }}
          restore-keys: ff-cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode calendar_check
