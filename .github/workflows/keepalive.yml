name: keepalive-dispatcher

# Backup dispatcher — 24/7 safety net for a dead external dispatcher.
#
# The real cadence comes from an external scheduler (cron-job.org) hitting
# workflow_dispatch — see docs/DISPATCHER-CRON.md. When that dispatcher dies
# (cron-job.org job disabled, PAT expired, or the old GAS 22:00-06:00 UTC
# dead-zone), GitHub's native `schedule:` cron is throttled to ~1 run/2-4h and
# the 6 digest rounds arrive hours late with few candidates. The 2026-09-22
# outage proved the old dead-zone-only guard left a gap: cron-job.org stopped at
# 08:30 UTC during ACTIVE hours, so keepalive (21:00-06:00 UTC only) never fired
# and the channel sat silent behind the throttled schedule for hours.
#
# This workflow fills that gap WITHOUT a PAT / external service: a native-cron
# job that, ONLY while the real dispatcher is silent, dispatches news_cron every
# 5 min for a ~5.5h rolling window, at ANY hour of day. It is a no-op the moment
# the real dispatcher is alive again (see dispatcher_alive below), so it never
# competes with cron-job.org once that is restored — the schedule fires, the
# alive-check sees a fresh workflow_dispatch, and the job exits in one step.
#
# Coverage caveat: GitHub throttles the schedule triggers below, so the loop may
# START up to a few hours after the dispatcher dies — but once started it holds
# 5-min cadence for ~5.5h, so a single start bridges most of a throttle window.
#
# 2026-09-27 rework — dispatch, don't run. The loop used to run
# `--mode cron` itself INSIDE the shared `gold-news` concurrency group for up to
# 5.5h. GitHub keeps only ONE pending run per group, so every other locked
# workflow queued behind it got cancelled: on 2026-09-23 (12:33-18:13 UTC)
# calendar-check, watchdog, squawk, calendar-daily all cancelled for the whole
# US data session (~30h of lock across 09-22..24). Now the loop only fires
# `gh workflow run` for news_cron (every 5 min) and calendar_check (every
# 10 min), exactly like cron-job.org would, and sits in its OWN group — the
# pipeline runs as normal short news-cron/calendar-check jobs that interleave
# with everything else instead of starving it.
#
# Safety:
#   - Own concurrency group `keepalive` → at most one loop at a time; it
#     touches no Sheets state itself, so it can't clobber anything.
#   - dispatcher_alive(): a news_cron workflow_dispatch in the last 20 min from
#     anyone OTHER than github-actions[bot] (i.e. cron-job.org's PAT) means the
#     real dispatcher is up → exit and yield. Our own dispatches are made with
#     GITHUB_TOKEN (actor github-actions[bot]) so they never count as "alive".

on:
  schedule:
    # 24/7 coverage: every 2h + offset refills. GitHub throttles these hard, but
    # each start holds 5-min cadence for ~5.5h, so >=1 getting through per window
    # bridges a dead dispatcher at ANY hour. No-op when cron-job.org is alive.
    - cron: "0 */2 * * *"              # every even hour
    - cron: "30 1,5,9,13,17,21 * * *"  # offset refills to raise start probability
  workflow_dispatch: {}

concurrency:
  group: keepalive          # NOT gold-news: this job never touches Sheets
  cancel-in-progress: false

permissions:
  actions: write            # gh workflow run (dispatch news_cron / calendar_check)
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # under the 6h hosted-runner hard limit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: keepalive loop (24/7 while dispatcher is dead)
        run: |
          set +e
          FRESH_MIN=20          # a real dispatch newer than this = dispatcher alive
          # dispatcher_alive() is the SOLE gate — it yields instantly whenever
          # cron-job.org is delivering. Hard stop = ~5.5h rolling window (under
          # the 350-min timeout); the next scheduled trigger restarts if needed.
          STOP=$(( $(date -u +%s) + 340 * 60 ))

          dispatcher_alive() {
            local ts age
            ts=$(gh api "repos/$GH_REPO/actions/workflows/news_cron.yml/runs?event=workflow_dispatch&per_page=15"                    -q '[.workflow_runs[] | select(.triggering_actor.login != "github-actions[bot]")] | .[0].created_at // ""'                    2>/dev/null)
            [ -z "$ts" ] && return 1
            age=$(( $(date -u +%s) - $(date -u -d "$ts" +%s 2>/dev/null || echo 0) ))
            [ "$age" -ge 0 ] && [ "$age" -lt $(( FRESH_MIN * 60 )) ]
          }

          i=0
          while [ "$(date -u +%s)" -lt "$STOP" ]; do
            if dispatcher_alive; then
              echo "[keepalive] real dispatcher is alive (recent external workflow_dispatch) — yielding"
              exit 0
            fi
            echo "[keepalive] $(date -u +%H:%M:%S) UTC dispatcher silent — dispatching news_cron"
            gh workflow run news_cron.yml || echo "[keepalive] news_cron dispatch failed, continuing"
            if [ $(( i % 2 )) -eq 0 ]; then
              gh workflow run calendar_check.yml || echo "[keepalive] calendar_check dispatch failed, continuing"
            fi
            i=$(( i + 1 ))
            [ "$(( $(date -u +%s) + 300 ))" -ge "$STOP" ] && break
            sleep 300
          done
          echo "[keepalive] reached rolling-window end (~5.5h) — exiting; next scheduled trigger resumes if still needed"
