name: XAU Daily Brief (Phase A — parallel-run)
# Composes 3x daily XAUUSD brief (07/15/23 ICT) using gold-news-pipeline's own
# line_client + price_feed + event_state. PARALLEL-RUN with Make scenario 5656446
# until output verified equivalent over 7+ days (see MIGRATION.md Phase A).
#
# Trigger 5 minutes before Make's slot so White can compare side-by-side.
# Cron: ICT 06:55 / 14:55 / 22:55 = UTC 23:55 (prev day) / 07:55 / 15:55

on:
  schedule:
    - cron: "55 23 * * *"   # ICT 06:55
    - cron: "55 7 * * *"    # ICT 14:55
    - cron: "55 15 * * *"   # ICT 22:55
  workflow_dispatch:
    inputs:
      slot:
        description: "Force slot (morning|mid|evening)"
        required: false
        default: "morning"

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compose + push XAU brief
        env:
          LINE_CHANNEL_TOKEN:  ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_BRIEF_TARGET:   ${{ secrets.LINE_NEWS_TARGET }}
          GSHEET_ID:           ${{ secrets.GSHEET_ID }}
          GSHEET_CREDS:        ${{ secrets.GSHEET_CREDS }}
          LOG_LEVEL:           INFO
          PHASE_A_PARALLEL_RUN: "1"
        run: |
          python -m src.xau_brief.composer
