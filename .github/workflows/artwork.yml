name: artwork
on:
  schedule:
    # 00:55 UTC = 07:55 ICT — after daily-brief posts the Notion page + log row.
    - cron: "55 0 * * *"
  workflow_dispatch: {}

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GSHEET_ID:      ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:   ${{ secrets.GSHEET_CREDS }}
      # OpenAI image gen. UNSET => DRY RUN (logs the prompt only).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_MODEL:    ${{ secrets.IMAGE_MODEL }}
      IMAGE_SIZE:     ${{ secrets.IMAGE_SIZE }}
      # Attach the artwork to the brief's Notion review page.
      NOTION_TOKEN:   ${{ secrets.NOTION_TOKEN }}
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode artwork
