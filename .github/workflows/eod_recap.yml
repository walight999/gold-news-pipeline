name: eod-recap
on:
  schedule:
    # 16:00 UTC = 23:00 ICT. Weekdays only — weekends skipped in code anyway.
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_NEWS_TARGET:   ${{ secrets.LINE_NEWS_TARGET }}
      LINE_HEALTH_TARGET: ${{ secrets.LINE_HEALTH_TARGET }}
      GSHEET_ID:          ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:       ${{ secrets.GSHEET_CREDS }}
      # LINE-independent ops channel — the EoD recap falls back to the operator's
      # Telegram DM when LINE can't deliver (quota/429). No-op when unset.
      OPS_TG_BOT_TOKEN:   ${{ secrets.OPS_TG_BOT_TOKEN }}
      OPS_TG_CHAT_ID:     ${{ secrets.OPS_TG_CHAT_ID }}
      PYTHONUNBUFFERED:   "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode eod_recap
