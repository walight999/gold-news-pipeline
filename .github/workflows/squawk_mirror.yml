name: squawk-mirror
on:
  schedule:
    # Every 15 min — mirror First Squawk's live gold-relevant headlines to X.
    # since_minutes (20) overlaps the gap so nothing is missed; squawk_log dedup
    # absorbs the overlap. GitHub throttles schedule cron to ~1/2-4h, so for true
    # cadence add a cron-job.org workflow_dispatch job (see docs/DISPATCHER-CRON.md).
    # No APIFY/ANTHROPIC/X creds => safe no-op.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GSHEET_ID:              ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:           ${{ secrets.GSHEET_CREDS }}
      APIFY_TOKEN:            ${{ secrets.APIFY_TOKEN }}
      ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
      X_API_KEY:              ${{ secrets.X_API_KEY }}
      X_API_SECRET:           ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN:         ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET:  ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode squawk_mirror
