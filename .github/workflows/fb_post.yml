name: fb-post
on:
  schedule:
    # Hourly — picks up the FB article once the operator ticks its Notion
    # approval checkbox. No approval / no FB secrets => no-op.
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: gold-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GSHEET_ID:     ${{ secrets.GSHEET_ID }}
      GSHEET_CREDS:  ${{ secrets.GSHEET_CREDS }}
      # Read the approval checkbox back off the brief's Notion page.
      NOTION_TOKEN:  ${{ secrets.NOTION_TOKEN }}
      # Facebook Page publish. UNSET => no-op. Long-lived Page token with
      # pages_manage_posts + pages_read_engagement. See docs/DAILY-BRIEF.md.
      FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode fb_post
