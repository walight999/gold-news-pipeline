# Apify X/Twitter fast-news source. Scrapes high-signal macro/gold accounts that
# break headlines before RSS. Gated by the APIFY_TOKEN secret — if the token is
# unset this whole block is a no-op, so `enabled: true` is safe to leave on.
# Cost: ~$0.18/1,000 tweets (kaitoeasyapi). min_interval_min caps run frequency.
x_accounts:
  enabled: true
  min_interval_min: 12        # normal cadence — don't re-scrape more often (cost guard)
  since_minutes: 14           # look back this far each scrape (= interval + 2m buffer;
                              # was 20 → paid for ~8m of overlapping tweets every scrape)
  # Event-mode burst (2026-09-10): during --mode event (the 30-min hot window
  # around a CPI/NFP/FOMC print, driven by calendar_check) X is scraped every
  # `event_min_interval_min` instead of 12, looking back `event_since_minutes`,
  # and widened by `event_extra_handles`. Concentrates Apify spend on the
  # minutes gold actually moves. A 30-min window at 3-min cadence ≈ 10 scrapes;
  # at ~$0.18/1k tweets and a handful of hits each, that's a few cents/event.
  event_min_interval_min: 3
  event_since_minutes: 5
  max_per_handle: 8
  handles:
    - DeItaone                # Walter Bloomberg — fast Fed/macro headlines
    - FirstSquawk             # geopolitical + macro wire
    - financialjuice          # macro headlines
    - KobeissiLetter          # macro analysis
    - NickTimiraos            # WSJ Fed reporter (rate-path signals)
    - KitcoNewsNOW            # gold-specific
    - GoldTelegraph_          # gold + macro
    # Added 2026-09-10 — curated high-signal gold/macro voices. More independent
    # orgs lifts breaking/alert confirmation (router needs >=2 orgs for alert),
    # ~free on the $0.18/1k actor. Watch content_log ~1-2wk and prune any noisy
    # ones. VERIFY each handle is still active before relying on it.
    - Ole_S_Hansen            # Saxo head of commodities — top gold analyst voice
    - WGC_News                # World Gold Council — CB gold buying + demand (structural)
    - Schuldensuehner         # Holger Z (Bloomberg) — macro + fast gold charts
  event_extra_handles:        # only scraped during the event burst window
    - LiveSquawk              # fast macro wire
    - Fxhedgers               # FX/rates flow
    - zerohedge               # fast (noisy) macro takes
    - PiQSuite                # fast macro/markets wire (breaking)
    - SteveLiesman            # CNBC Fed reporter (rate-path signals, event window)

# Truth Social (2026-09-10) — Trump posts (tariffs / Fed pressure / geopolitics)
# move gold intraday and appear in NO RSS feed. Posts become tier-2 wire entries
# in the SAME pool as tweets. OPT-IN: third-party actor output shapes differ, so
# validate ONCE with `python -m src.main --mode apify_probe --target truth`
# (costs one actor call), fix `field_map` if the probe extracts 0, THEN flip
# enabled: true. Gated by APIFY_TOKEN like everything Apify.
truth_social:
  enabled: false
  # VERIFY via the probe, then keep or swap. Candidates seen 2026-09 on Apify:
  # parsebird/truth-social-scraper, automation-lab/truth-social-scraper,
  # tri_angle/truth-scraper, muhammetakkurtt/truth-social-scraper.
  actor_id: "parsebird/truth-social-scraper"
  input_key: "profiles"       # some actors want "usernames" or "startUrls" — probe tells you
  min_interval_min: 15
  event_min_interval_min: 5
  since_minutes: 45           # freshness gate (only applied when posts carry a timestamp)
  max_per_handle: 6
  tier: 2
  handles:
    - realDonaldTrump
    - DonaldJTrumpJr
  payload_extra: {}           # merged into actor input (e.g. {"onlyPosts": true})
  field_map: {}               # override output field names if the probe extracts 0
                              # e.g. {text: [content], handle: [username], created: [created_at]}

# Cloudflare-recovery (2026-09-10) — fetch RSS feeds that a plain httpx GET can
# no longer reach (Benzinga has 403'd behind Cloudflare since 2026-06-19) via an
# Apify browser/unblocker actor; the raw body goes straight through parse_feed,
# so we recover a real wire source with the Apify capacity already paid for.
# OPT-IN: pick an actor, then `python -m src.main --mode apify_probe --target recover:benzinga_apify`,
# confirm parse_feed yields entries, THEN flip enabled: true.
# NOTE: Reuters is intentionally NOT here — it has no public RSS to recover, and
# its gold/Fed coverage already arrives via the yahoo_finance syndication feed.
apify_recover:
  enabled: false
  actor_id: ""                # e.g. a Cloudflare-bypass actor that returns the page body
  input_key: "startUrls"      # apify/*-scraper convention; probe confirms
  url_as_object: true         # true → [{"url": u}]; false → [u]
  body_field: [body, html, content, text]   # dataset field holding the raw page body
  min_interval_min: 10
  payload_extra: {}
  feeds:
    - {id: benzinga_apify, url: "https://www.benzinga.com/markets/feed", tier: 2, source_class: wire, organization: benzinga, role: trader_macro}

sources:
  # source_class + organization: both used by independent_source_count.
  # Phase 2.3 (2026-05-23) — was previously single-axis source_class
  # which collapsed too aggressively: BBC+AlJazeera+CNBC+MW+Yahoo all
  # reported as "aggregator" → count=1 regardless of how many newsrooms
  # confirmed. We now count UNIQUE ORGANIZATIONS instead, so 4 Investing
  # endpoints (same org) still count as 1 but 4 newsdesks count as 4.
  #
  # source_class kept for legacy code paths but `organization` is the
  # field the breaking/alert confirmation logic now uses.
  # tier-0 official sources poll every 5 min (was 15): a Fed statement / BLS print
  # is the highest-value gold event and must not sit up to 15 min behind ForexLive.
  # Cost is ~free — conditional GET (ETag / If-Modified-Since) returns 304 most polls.
  - {id: fed,         tier: 0, source_class: official,   organization: us_gov,       role: policy,       url: "https://www.federalreserve.gov/feeds/press_all.xml", poll_min: 5,  enabled: true}
  - {id: bls,         tier: 0, source_class: official,   organization: us_gov,       role: data_release, url: "https://www.bls.gov/feed/bls_latest.rss",            poll_min: 5,  enabled: true}
  - {id: ecb,         tier: 0, source_class: official,   organization: ecb,          role: policy,       url: "https://www.ecb.europa.eu/rss/press.xml",            poll_min: 5,  enabled: true}
  - {id: treasury,    tier: 0, source_class: official,   organization: us_gov,       role: yields,       url: "",                                                   poll_min: 15, enabled: false, note: "no public RSS endpoint"}
  - {id: bbc_world,   tier: 1, source_class: aggregator, organization: bbc,          role: geopolitics,  url: "https://feeds.bbci.co.uk/news/world/rss.xml",        poll_min: 15, enabled: true}
  - {id: aljazeera,   tier: 1, source_class: aggregator, organization: aljazeera,    role: geopolitics,  url: "https://www.aljazeera.com/xml/rss/all.xml",          poll_min: 15, enabled: true}
  - {id: cnbc,        tier: 1, source_class: aggregator, organization: cnbc,         role: macro,        url: "https://www.cnbc.com/id/100003114/device/rss/rss.html", poll_min: 10, enabled: true}
  - {id: marketwatch, tier: 1, source_class: aggregator, organization: marketwatch,  role: macro,        url: "https://feeds.marketwatch.com/marketwatch/topstories/", poll_min: 10, enabled: true}
  - {id: forexlive,   tier: 2, source_class: wire,       organization: forexlive,    role: trader_macro, url: "https://www.forexlive.com/feed/",                    poll_min: 5,  enabled: true}
  - {id: fxstreet,    tier: 2, source_class: wire,       organization: fxstreet,     role: gold_bias,    url: "https://www.fxstreet.com/rss",                       poll_min: 5,  enabled: true}
  - {id: kitco,       tier: 3, source_class: gold_blog,  organization: kitco,        role: gold_context, url: "https://www.kitco.com/rss/",                         poll_min: 60, enabled: false, note: "feed 404"}
  # Investing.com runs without Cloudflare — plain httpx returns 200.
  # All 3 endpoints under ONE organization=investing so they don't fake
  # source diversity for confirmation logic.
  - {id: investing_cb,          tier: 1, source_class: aggregator, organization: investing,     role: rate_policy,  url: "https://www.investing.com/rss/news_95.rss",  poll_min: 10, enabled: true}
  - {id: investing_commodities, tier: 1, source_class: aggregator, organization: investing,     role: gold_context, url: "https://www.investing.com/rss/news_11.rss",  poll_min: 10, enabled: true}
  - {id: investing_general,     tier: 1, source_class: aggregator, organization: investing,     role: macro,        url: "https://www.investing.com/rss/news.rss",     poll_min: 10, enabled: true}
  - {id: benzinga,              tier: 2, source_class: wire,       organization: benzinga,      role: trader_macro, url: "https://www.benzinga.com/markets/feed",      poll_min: 5,  enabled: false, note: "DISABLED 2026-08-13 — Cloudflare 403 on every endpoint (/markets/feed, /feed, feeds.benzinga.com) since 2026-06-19; 1149 consecutive errors, last item 06-19. Re-probed 08-13, still 403 with a browser UA. Flip enabled:true if Benzinga reopens the feed."}
  - {id: yahoo_finance,         tier: 1, source_class: aggregator, organization: yahoo,         role: macro,        url: "https://finance.yahoo.com/news/rssindex",    poll_min: 10, enabled: true,  note: "Reuters/AP syndication"}
  # Reuters has no free public RSS (killed years ago) — pull its gold-macro coverage
  # via Google News RSS, filtered to reuters.com + macro keywords. feedparser/httpx
  # verified 2026-06-23: 100 entries, real gold/Fed/ECB headlines. Caveat: item links
  # are news.google.com redirects (not direct reuters.com); titles carry " - Reuters".
  - {id: reuters_macro,         tier: 1, source_class: aggregator, organization: reuters,       role: macro,        url: "https://news.google.com/rss/search?q=site:reuters.com+(gold+OR+Fed+OR+inflation+OR+dollar+OR+Treasury+OR+%22interest+rate%22+OR+ECB+OR+economy)+when:1d&hl=en-US&gl=US&ceid=US:en", poll_min: 10, enabled: false, note: "DISABLED 2026-06-24 — Google News path is day-old (too slow to confirm breaking) + redirect links, and never surfaced clean; Reuters syndication already arrives via yahoo_finance. Flip enabled:true to revive."}

